<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel — Contribua</title>
  <link rel="stylesheet" href="platform.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22s7-6.3 7-12a7 7 0 1 0-14 0c0 5.7 7 12 7 12z"></path>
        <circle cx="12" cy="10" r="2.7"></circle>
      </svg>
      CONTRIBUA
    </div>
    <div class="actions">
      <span class="who" id="who"></span>
      <button class="btn" id="logout" type="button">Sair</button>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h2>Minhas tabelas</h2>
        <p class="muted" style="margin:6px 0 0">Crie, compartilhe e acompanhe os pagamentos.</p>
      </div>
      <button class="btn btn-primary" id="new-table" type="button">+ Nova tabela</button>
    </div>

    <div class="cards" id="cards"></div>

    <div class="empty" id="empty" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M3 9h18M9 21V9"></path></svg>
      <p>Você ainda não criou nenhuma tabela.</p>
      <button class="btn btn-primary" id="new-table-2" type="button">Criar a primeira</button>
    </div>
  </main>

  <div class="editor" id="editor">
    <div class="editor-panel">
      <h2 id="editor-title">Nova tabela</h2>
      <p class="editor-sub" id="editor-sub">Defina os dados e os participantes.</p>

      <form id="editor-form">
        <div class="row">
          <label class="field"><span>Título</span>
            <input type="text" name="title" required placeholder="Ex.: Vaquinha do aniversário">
          </label>
          <label class="field"><span>Subtítulo / evento</span>
            <input type="text" name="subtitle" placeholder="Ex.: Natal 2026">
          </label>
        </div>

        <div class="row">
          <label class="field"><span>Rótulo da parcela</span>
            <input type="text" name="installment_label" placeholder="Ex.: 1ª PARCELA">
          </label>
          <label class="field"><span>Vencimento</span>
            <input type="text" name="installment_due" placeholder="Ex.: 20/10/2026">
          </label>
        </div>

        <div class="row">
          <label class="field"><span>Valor por pessoa (R$)</span>
            <input type="number" name="installment_reais" min="0" step="0.01" placeholder="50,00">
          </label>
          <label class="field"><span>Valor total (R$)</span>
            <input type="number" name="goal_reais" min="0" step="0.01" placeholder="1700,00">
            <small>Opcional — usado para o percentual.</small>
          </label>
        </div>

        <div class="row">
          <label class="field"><span>Nome da beneficiária do Pix</span>
            <input type="text" name="pix_name" placeholder="Ex.: Julia">
          </label>
          <label class="field"><span>Chave Pix</span>
            <input type="text" name="pix_key" placeholder="CPF, e-mail, telefone...">
          </label>
        </div>

        <label class="field" style="display:flex;align-items:center;gap:10px">
          <input type="checkbox" name="allow_public_edit" checked style="width:auto">
          <span style="margin:0">Permitir que o link público marque pagamentos</span>
        </label>

        <div class="divider"></div>

        <div id="block-bulk">
          <div class="section-title">Participantes (um por linha)</div>
          <label class="field bulk"><textarea name="participants_bulk" placeholder="Caio&#10;Jasson Santos&#10;Leda"></textarea></label>
        </div>

        <div id="block-manage" hidden>
          <div class="section-title">Participantes</div>
          <div class="participants-list" id="participants-list"></div>
          <div class="add-row">
            <input type="text" id="new-participant" placeholder="Nome do participante">
            <button class="btn" id="add-participant" type="button">Adicionar</button>
          </div>
        </div>

        <div class="editor-actions">
          <button class="btn btn-danger" id="delete-table" type="button" hidden>Excluir tabela</button>
          <button class="btn" id="cancel" type="button">Fechar</button>
          <button class="btn btn-primary" type="submit" id="save-table">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="common.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
