name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy para produção (PM2)
    runs-on: ubuntu-latest

    steps:
      - name: Executar deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            APP_DIR="${{ secrets.APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="/home/contribua"; fi
            echo "==> APP_DIR=$APP_DIR"
            cd "$APP_DIR"
            echo "==> Diretório atual: $(pwd)"
            if [ ! -f deploy.sh ]; then
              echo "==> deploy.sh não encontrado em $(pwd). Conteúdo:"
              ls -la
              echo "==> Ajuste o secret APP_DIR para o diretório que contém o deploy.sh."
              exit 1
            fi
            bash deploy.sh
